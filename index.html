<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPredictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>LeadPredictor</h2>
            <div class="form-group">
                <label for="language">Language</label>
                <select id="language">
                    <option>English</option>
                    <option>Bulgarian</option>
                </select>
            </div>
            <div class="form-group">
                <label for="currency">Currency</label>
                <select id="currency">
                    <option value="$">US Dollar</option>
                    <option value="€">Euro</option>
                    <option value="£">British Pound</option>
                </select>
            </div>
            <div class="form-group">
                <label for="campaignStart">Campaign Start</label>
                <input type="date" id="campaignStart" value="2026-05-08">
            </div>
            <div class="form-group">
                <label for="campaignEnd">Campaign End</label>
                <input type="date" id="campaignEnd" value="2026-11-04">
            </div>
            <div class="form-group">
                <label for="revenue">Total Revenue ($)</label>
                <input type="number" id="revenue" min="0" step="any" required value="10000">
            </div>
            <div class="form-group">
                <label for="avgOrder">Avg. Order Value ($)</label>
                <input type="number" id="avgOrder" min="0.01" step="any" required value="1000">
            </div>
            <div class="form-group">
                <div class="label-row">
                    <label for="leadRate">Lead Response Rate</label>
                    <output id="leadRateValue" for="leadRate">40%</output>
                </div>
                <input type="range" id="leadRate" min="1" max="100" step="1" value="40">
            </div>
            <div class="form-group">
                <div class="label-row">
                    <label for="prospectRate">Prospect Response Rate</label>
                    <output id="prospectRateValue" for="prospectRate">20%</output>
                </div>
                <input type="range" id="prospectRate" min="1" max="100" step="1" value="20">
            </div>
        </aside>

        <main class="main-content">
            <div class="card">
                <h3>Customers</h3>
                <p id="customersResult" aria-live="polite">10</p>
            </div>
            <div class="card">
                <h3>Leads</h3>
                <p id="leadsResult" aria-live="polite">25</p>
            </div>
            <div class="card">
                <h3>Prospects</h3>
                <p id="prospectsResult" aria-live="polite">125</p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
